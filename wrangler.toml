name = "zemekviz"
compatibility_date = "2026-08-24"

# POZOR: `account_id` sem NEPATŘÍ. Zkusil jsem ho sem 2026-09-01 dát a `wrangler pages
# deploy` na tom spadl s „Configuration file for Pages projects does not support
# account_id" — u Pages projektů se ta volba nepodporuje, i když `wrangler d1 execute`
# ji tiše sní. Projekt i databáze žijí pod účtem evzen.weigl@gmail.com
# (3005fa92056c05be6e87ea85a5df5ab9).
#
# Když wrangler sáhne po špatném účtu, hlásí u D1 „database could not be found
# [code: 7404]" — což svádí na smazanou databázi, ne na špatný účet. Řeší se to
# proměnnou prostředí pro ten jeden příkaz, ne konfigurací:
#   $env:CLOUDFLARE_ACCOUNT_ID='3005fa92056c05be6e87ea85a5df5ab9'
# Nejdřív si ale ověř `npx wrangler whoami` — obvykle stačí být přihlášený správným
# e-mailem a nic dalšího není potřeba.

# Nasazuje se VÝHRADNĚ z dist/, které staví scripts/build-public.js jen z toho, co má
# být venku. Do 2026-08-25 tu stálo ".", což na web nahrálo i CLAUDE.md, schema.sql,
# package.json a 2,8MB data/d1-seed.sql — `.assetsignore` to nezachrání, Pages ho ignorují.
# Tehdejší oprava spočívala jen v tom, že `npm run deploy` předává `dist` výslovně;
# tahle hodnota zůstala na "." a byla to tikající past: kdyby se u projektu zapnulo
# sestavení z GitHubu, Cloudflare by si vzal ji a repo by bylo venku. (2026-09-01)
#
# Lokální vývoj proto NESMÍ spoléhat na tuhle hodnotu a `npm run dev` si kořen předává
# sám (`wrangler pages dev .`) — jinak by servíroval postavené dist/ a změny v quiz.js
# by se neprojevily, dokud se nespustí build.
pages_build_output_dir = "dist"

# API běží jako Pages Functions ve složce functions/ na stejné doméně jako statika,
# takže odpadá CORS. Lokální běh: npm run dev (wrangler pages dev, funguje offline).
[[d1_databases]]
binding = "DB"
database_name = "zemekviz"
database_id = "70ea7dcf-aec5-4145-959b-d4753acfed35"
