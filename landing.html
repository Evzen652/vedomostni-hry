<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vědomostní hry — vyber si téma</title>
<meta name="description" content="Vědomostní párty hra — vyber si téma (zeměpis, fotbal, dějepis a další) a hraj sólo, s partou nebo ve škole.">
<style>
  @font-face{ font-family:'Nunito'; font-style:normal; font-weight:200 1000; font-display:swap;
    src:url('assets/fonts/nunito-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face{ font-family:'Nunito'; font-style:normal; font-weight:200 1000; font-display:swap;
    src:url('assets/fonts/nunito-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  :root{ --paper:#f7efe0; --paper2:#fffaf0; --ink:#3d3229; --muted:#8a7a66;
    --teal:#2a7f7f; --coral:#e2725b; --ochre:#d9a441; --line:#dccdb0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ min-height:100vh; font-family:'Nunito', system-ui, sans-serif; color:var(--ink);
    background:radial-gradient(1100px 560px at 50% -10%, #fdf7ea 0%, transparent 60%), #efe4cf;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 18px; }
  header{ text-align:center; margin-bottom:26px; }
  .logo{ width:112px; height:112px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 14px;
    border:4px solid #fffdf6; outline:2px solid #d8c9ad; background:var(--paper2);
    box-shadow:0 10px 26px rgba(120,90,50,.30); }
  h1{ font-family:'Nunito', sans-serif; font-size:clamp(28px,5vw,42px); font-weight:800; letter-spacing:.01em; color:var(--teal); }
  .sub{ color:var(--muted); font-size:clamp(14px,2.3vw,16px); margin-top:8px; max-width:520px; }
  .topics{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:20px; width:min(820px,96vw); }
  .topic{ background:var(--paper2); border:1.6px solid var(--line); border-radius:20px; padding:18px 16px 16px;
    text-align:center; text-decoration:none; color:inherit; display:flex; flex-direction:column; align-items:center; gap:12px;
    box-shadow:0 4px 0 #e3d5b8, 0 14px 30px rgba(120,90,50,.14); position:relative;
    transition:transform .16s, box-shadow .16s; }
  a.topic:hover{ transform:translateY(-3px); box-shadow:0 6px 0 #e3d5b8, 0 20px 38px rgba(120,90,50,.2); }
  .frame{ width:140px; height:140px; border-radius:18px; overflow:hidden;
    border:3px solid #fffdf6; outline:2px solid #d8c9ad; box-shadow:0 8px 20px rgba(120,90,50,.26); }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .tname{ font-family:'Nunito', sans-serif; font-size:21px; font-weight:650; }
  .tstat{ font-size:13px; font-weight:700; color:var(--muted); }
  .tstat.play{ color:#fffdf6; background:var(--coral); padding:9px 24px; border-radius:14px;
    box-shadow:0 4px 0 #b1543f, 0 8px 18px rgba(226,114,91,.35); font-family:'Nunito', sans-serif; font-size:15px; }
  .topic.soon{ opacity:.7; }
  .topic.soon .frame{ filter:saturate(.85); }
  .topic.soon .badge{ position:absolute; top:12px; right:12px; background:var(--ochre); color:#fffdf6;
    font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .foot{ color:var(--muted); font-size:12.5px; margin-top:28px; text-align:center; font-style:italic; }
  @media (max-width:640px){ .topics{ grid-template-columns:1fr; max-width:360px; } .frame{ width:120px; height:120px; } }
</style>
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.jpg" alt="Vědomostní hry — logo">
    <h1>Vědomostní hry</h1>
    <p class="sub">Vědomostní hra, která bere fakta vážně — a sebe ani náhodou. Sólo, s partou u stolu, nebo ve škole.</p>
  </header>

  <div class="topics">
    <a class="topic" href="hra.html">
      <div class="frame"><img src="assets/topic-zemepis.jpg" alt="Zeměpis"></div>
      <div class="tname">Zeměpis</div>
      <div class="tstat play">Hrát →</div>
    </a>
    <div class="topic soon">
      <div class="badge">Brzy</div>
      <div class="frame"><img src="assets/topic-sport.jpg" alt="Sport"></div>
      <div class="tname">Sport</div>
      <div class="tstat">Připravujeme</div>
    </div>
    <div class="topic soon">
      <div class="badge">Brzy</div>
      <div class="frame"><img src="assets/topic-dejepis.jpg" alt="Dějepis"></div>
      <div class="tname">Dějepis</div>
      <div class="tstat">Připravujeme</div>
    </div>
  </div>

  <p class="foot">Další témata brzy · hraje se na jednom tabletu · 2–6 hráčů · napříč generacemi</p>
</body>
</html>
