<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vědomostní hra — poznávej země světa</title>
<meta name="description" content="Vědomostní párty hra o zemích světa — sólo, párty i školní režim, s hláškami a hlasem.">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
  <div id="quiz-root">
    <div class="qz-shell" id="qz-shell">
      <button class="qz-close" id="qz-close" title="Domů">×</button>
      <div class="qz-host" id="qz-host">
        <div class="qz-host-av" id="qz-host-av"><img src="assets/logo.jpg" alt="Hostitel — sova"></div>
        <!-- role/aria-live: bublina hostitele je jediné místo, kde padne verdikt („Správně!"),
             takže právě ji necháme oznamovat odečítačům obrazovky -->
        <div class="qz-host-bubble" id="qz-host-bubble" role="status" aria-live="polite">Vítej, cestovateli!</div>
      </div>
      <div id="qz-body" style="display:flex;flex-direction:column;flex:1"></div>
    </div>
  </div>
  <!-- Jediná externí věc, kterou appka za běhu načítá. `integrity` je proto povinné:
       bez něj by kompromitované CDN (nebo MITM) podstrčilo skript se stejnými právy
       jako online.js, tedy i s přístupem k přihlašovacímu tokenu v localStorage.
       Otisk je spočítaný ze skutečně staženého souboru (three.js r137, MIT), ne opsaný.
       Když se hash nesejde, prohlížeč skript neprovede a glóbus se prostě nevykreslí —
       quiz.js s tím počítá (`typeof THREE === "undefined"`), takže hra běží dál.
       Pozn.: pořád to odporuje konvenci „vše je součástí repa" (kvůli ní se 2026-07-27
       stahovala do assets/ i textura glóbu). Stažení knihovny do repa by tu závislost
       odstranilo úplně; zatím je to aspoň ověřené. (2026-09-01) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"
          integrity="sha384-WgG62qhSmnkOoW866eO1eLJd4HfFyZ2f8XnAK/VJR9mv/JffD14EgnvgpNEw3MmF"
          crossorigin="anonymous"></script>
  <!-- Online režim je nepovinný: když se nenačte nebo neběží server, quiz.js
       čtvrtou dlaždici prostě nevykreslí a offline hra funguje dál. -->
  <script src="online.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
