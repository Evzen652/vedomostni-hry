<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cestokvíz — vědomostní hra o zemích světa</title>
<meta name="description" content="4 012 otázek o 55 zemích, každá s vlastní malovanou ilustrací. Hraj sólo, s partou u stolu, ve škole, nebo online o rating.">

<!-- NÁHLED PRO SDÍLENÍ. Bez těchhle značek je odkaz v chatu jen holý text, takže
     appku nikdo nepozná a nikdo na ni neklikne — a sdílení je jediný kanál, který
     nestojí nic. `og:image` MUSÍ být absolutní URL, relativní cestu scrapery neberou.
     {{WEB}} dosazuje build (scripts/build-public.js, konstanta WEB) — doména se tedy
     mění na JEDNOM místě. Lokálně placeholder zůstane; hře to nevadí, značky čtou
     jen scrapery. Že v dist/ nezůstal, hlídá build sám. -->
<link rel="canonical" href="{{WEB}}/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cestokvíz">
<meta property="og:locale" content="cs_CZ">
<meta property="og:url" content="{{WEB}}/">
<meta property="og:title" content="Cestokvíz — vědomostní hra o zemích světa">
<meta property="og:description" content="4 012 otázek o 55 zemích, každá s vlastní malovanou ilustrací. Hraj sólo, s partou u stolu, ve škole, nebo online o rating.">
<meta property="og:image" content="{{WEB}}/assets/og-cestokviz.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Parta lidí piknikuje na vrcholu malovaného glóbu, vedle nápis Cestokvíz.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cestokvíz — vědomostní hra o zemích světa">
<meta name="twitter:description" content="4 012 otázek o 55 zemích, každá s vlastní malovanou ilustrací. Hraj sólo, s partou u stolu, ve škole, nebo online o rating.">
<meta name="twitter:image" content="{{WEB}}/assets/og-cestokviz.jpg">

<link rel="stylesheet" href="quiz.css">
<link rel="manifest" href="/manifest.json">
<!-- Barva lišty systému. Je schválně TOTOŽNÁ se spodkem přechodu na pozadí appky
     (`#quiz-root` jede z bílé do #fdf6e8), takže na telefonu nevznikne cizí barevný
     pruh nad stránkou a appka působí jako jeden kus papíru. -->
<meta name="theme-color" content="#fdf6e8">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
</head>
<body>
  <div id="quiz-root">
    <div class="qz-shell" id="qz-shell">
      <button class="qz-close" id="qz-close" title="Domů">×</button>
      <div class="qz-host" id="qz-host">
        <div class="qz-host-av" id="qz-host-av"><img src="assets/logo.jpg" alt="Hostitel — sova"></div>
        <!-- role/aria-live: bublina hostitele je jediné místo, kde padne verdikt („Správně!"),
             takže právě ji necháme oznamovat odečítačům obrazovky -->
        <div class="qz-host-bubble" id="qz-host-bubble" role="status" aria-live="polite">Vítej, cestovateli! Chystám ti mapu…</div>
      </div>
      <div id="qz-body" style="display:flex;flex-direction:column;flex:1"></div>
    </div>
  </div>
  <!-- Three.js JE NOVĚ V REPU (2026-09-06). Do té doby se tahal z cdn.jsdelivr.net —
       jediná externí věc, kterou appka za běhu načítala, a tím i jediné místo, kde
       kompromitované CDN mohlo podstrčit skript se stejnými právy jako online.js,
       tedy i s přístupem k přihlašovacímu tokenu v localStorage. `integrity` to sice
       hlídalo, ale zůstávala závislost na cizí dostupnosti a výjimka v CSP.
       Stažený soubor má TENTÝŽ otisk, jaký tu byl v `integrity`
       (sha384-WgG62qhSmnkOoW866eO1eLJd4HfFyZ2f8XnAK/VJR9mv/JffD14EgnvgpNEw3MmF),
       takže je bajtově shodný s tím, co appka načítala doteď — three.js r137, MIT.
       Tím se zároveň naplnila konvence „vše je součástí repa" a CSP je čistě 'self'.
       Když se skript nenačte, quiz.js s tím počítá (`typeof THREE === "undefined"`)
       a hra běží dál, jen bez glóbu. -->
  <script src="assets/three.min.js"></script>
  <!-- Online režim je nepovinný: když se nenačte nebo neběží server, quiz.js
       čtvrtou dlaždici prostě nevykreslí a offline hra funguje dál. -->
  <script src="online.js"></script>
  <script src="quiz.js"></script>
  <!-- Service worker (2026-09-25). Registruje se AŽ PO `load`, ne dřív: instalace
       stahuje skořápku a na pomalé lince by soupeřila o pásmo s tím, co hráč právě
       potřebuje vidět. Registrace navíc nesmí shodit hru, když ji prohlížeč odmítne
       (starý prohlížeč, soukromé okno, vypnuté úložiště) — proto ten `catch`.
       Soubor leží v kořeni schválně: rozsah service workeru je dán jeho umístěním,
       takže odsud pokrývá i právní stránky. -->
  <script>
    if ("serviceWorker" in navigator) {
      addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (e) {
          console.warn("[sw] registrace neprošla, hra běží dál bez offline režimu", e);
        });
      });
    }
  </script>
</body>
</html>
