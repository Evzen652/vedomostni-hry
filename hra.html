<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vědomostní hra — poznávej země světa</title>
<meta name="description" content="Vědomostní párty hra o zemích světa — sólo, párty i školní režim, s hláškami a hlasem.">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
  <div id="quiz-root">
    <div class="qz-shell" id="qz-shell">
      <button class="qz-close" id="qz-close" title="Domů">×</button>
      <div class="qz-host" id="qz-host">
        <div class="qz-host-av" id="qz-host-av"><img src="assets/logo.jpg" alt="Hostitel — sova"></div>
        <!-- role/aria-live: bublina hostitele je jediné místo, kde padne verdikt („Správně!"),
             takže právě ji necháme oznamovat odečítačům obrazovky -->
        <div class="qz-host-bubble" id="qz-host-bubble" role="status" aria-live="polite">Vítej, cestovateli!</div>
      </div>
      <div id="qz-body" style="display:flex;flex-direction:column;flex:1"></div>
    </div>
  </div>
  <!-- Three.js JE NOVĚ V REPU (2026-09-06). Do té doby se tahal z cdn.jsdelivr.net —
       jediná externí věc, kterou appka za běhu načítala, a tím i jediné místo, kde
       kompromitované CDN mohlo podstrčit skript se stejnými právy jako online.js,
       tedy i s přístupem k přihlašovacímu tokenu v localStorage. `integrity` to sice
       hlídalo, ale zůstávala závislost na cizí dostupnosti a výjimka v CSP.
       Stažený soubor má TENTÝŽ otisk, jaký tu byl v `integrity`
       (sha384-WgG62qhSmnkOoW866eO1eLJd4HfFyZ2f8XnAK/VJR9mv/JffD14EgnvgpNEw3MmF),
       takže je bajtově shodný s tím, co appka načítala doteď — three.js r137, MIT.
       Tím se zároveň naplnila konvence „vše je součástí repa" a CSP je čistě 'self'.
       Když se skript nenačte, quiz.js s tím počítá (`typeof THREE === "undefined"`)
       a hra běží dál, jen bez glóbu. -->
  <script src="assets/three.min.js"></script>
  <!-- Online režim je nepovinný: když se nenačte nebo neběží server, quiz.js
       čtvrtou dlaždici prostě nevykreslí a offline hra funguje dál. -->
  <script src="online.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
